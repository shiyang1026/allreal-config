name: Release Windows amd64

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish, for example v0.1.0"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Build and publish Windows amd64
    runs-on: windows-latest

    env:
      BINARY_NAME: allreal-config

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME}"
          fi

          if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "Version must look like v0.1.0 or v0.1.0-beta.1" >&2
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "version_without_v=${VERSION#v}" >> "$GITHUB_OUTPUT"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install frontend dependencies
        working-directory: frontend
        run: bun install --frozen-lockfile

      - name: Build frontend
        working-directory: frontend
        run: bun run build

      - name: Run Go tests
        run: go test -count=1 ./...

      - name: Build Windows amd64 app
        shell: bash
        run: bash scripts/build-windows-amd64.sh

      - name: Install NSIS
        run: choco install nsis -y

      - name: Package Windows release
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version_without_v }}
        run: bash scripts/package-windows.sh

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: AllReal Config ${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: |
            dist/*
