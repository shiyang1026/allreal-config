name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Test and build (${{ matrix.os }})
    strategy:
      matrix:
        os: [macos-15, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install frontend dependencies
        working-directory: frontend
        run: bun install --frozen-lockfile

      - name: Build frontend
        working-directory: frontend
        run: bun run build

      - name: Run Go tests
        run: go test -count=1 ./...

      - name: Build macOS arm64 app
        if: runner.os == 'macOS'
        run: bash scripts/build-macos-arm64.sh

      - name: Build Windows amd64 app
        if: runner.os == 'Windows'
        shell: bash
        run: bash scripts/build-windows-amd64.sh
